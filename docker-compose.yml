version: '3.8'

services:
  web:
    build:
      context: ./connect.sampidia.com
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=sngine_db
      - DB_USER=sngine_user
      - DB_PASSWORD=secretpassword
      - SYS_URL=http://localhost:8080
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sngine_db
      MYSQL_USER: sngine_user
      MYSQL_PASSWORD: secretpassword
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
